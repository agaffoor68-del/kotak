services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: alphatrade-api
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TZ: Asia/Kolkata
      # Ticks and candles are high-frequency; keep them on a volume.
      DATA_DIR: /app/var
    volumes:
      - market_data:/app/var
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: alphatrade-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # The only public surface. The API is never exposed directly.
  proxy:
    image: nginx:1.27-alpine
    container_name: alphatrade-proxy
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/alphatrade.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  market_data:
