name: Deploy Pages

# The Pages site is the static landing page in pages_site/. The terminal itself
# runs on the host via docker-compose.yml -- GitHub Pages cannot host it.

on:
  push:
    branches: [main, master]
    paths: ['pages_site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages_site

      - id: deployment
        uses: actions/deploy-pages@v4