# Plain-HTTP front door for cloud bootstrap.
#
# Use this while you are still issuing a certificate (or when TLS terminates at
# Cloudflare / a load balancer and never reaches this host). It is identical to
# alphatrade.conf minus the SSL server block. Once the certificate exists,
# switch back by mounting alphatrade.conf instead.

upstream alphatrade_web {
    server web:3000;
}

upstream alphatrade_api {
    server api:8000;
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://alphatrade_api/api/v1/system/health;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://alphatrade_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    # --- WebSocket tick feed: long-lived by design, never time it out ---
    location /ws/ {
        proxy_pass http://alphatrade_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://alphatrade_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Terminal ---
    location / {
        proxy_pass http://alphatrade_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
